<!-- Question 2: Delete All Items from a List
Write a function clearList that removes all list items from an unordered list with the given ID. -->



<!DOCTYPE html>
<html lang="en">
<body>
  // Your code here
  <ul id="todoList">
    <li>
      Task1
    </li>
    <li>task2</li>
  </ul>

  <script>
    //Your code here
    function clearList(listId){
      const ul = document.getElementById(listId); 
      ul.innerHTML = " "
    }
    
  </script>
</body>
</html>
